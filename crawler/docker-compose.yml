services:
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stac-crawler
    # Runs scheduler.js (see Dockerfile). Restarting continues the running crawl cycle.
    restart: unless-stopped
    # Time to finish the current batch and flush to the DB on `docker compose stop`
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    networks:
      - stac-network

networks:
  stac-network:
    driver: bridge
